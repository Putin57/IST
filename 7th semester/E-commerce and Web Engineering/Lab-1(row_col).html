<!doctype html>
<html>
  <head>
    <title>Table Layout</title>
    <style>
      table {
        width: 250px;
        height: 200px;
        border: 1px solid black;
        border-collapse: collapse;
        text-align: center;
        font-size: 11px;
      }

      td {
        border: 1px solid black;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td>A</td>
        <td>B</td>
        <td>C</td>
        <td>D</td>
        <td>E</td>
      </tr>

      <tr>
        <td>F</td>
        <td>G</td>
        <td colspan="2" rowspan="2">H</td>
        <td>I</td>
      </tr>

      <tr>
        <td>J</td>
        <td>K</td>
        <td>L</td>
      </tr>

      <tr>
        <td>M</td>
        <td rowspan="3">N</td>
        <td>O</td>
        <td>P</td>
        <td>Q</td>
      </tr>

      <tr>
        <td rowspan="2">R</td>
        <td>S</td>
        <td colspan="2">T</td>
      </tr>

      <tr>
        <td colspan="3">U</td>
      </tr>

      <tr>
        <td colspan="5">Z Z Z</td>
      </tr>
    </table>
  </body>
</html>
